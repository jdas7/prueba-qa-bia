name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Levantar EnergIA (backend + frontend)
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --build

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm typecheck

      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && curl -fsS http://localhost:3000 >/dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - run: pnpm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reporte-evidencias
          path: qa/evidencias/index.html
          retention-days: 14

      - name: Logs del backend
        if: failure()
        working-directory: .
        run: docker compose logs backend
